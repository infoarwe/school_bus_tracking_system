# Host Nginx site for School Bus Tracking on a shared server (deploy/docker-compose.proxied.yml).
# Copy to /etc/nginx/conf.d/<SERVER_NAME>.conf, replace ics.ridelogic.in, `nginx -t`,
# `systemctl reload nginx`, then `certbot --nginx -d <SERVER_NAME>` adds the HTTPS server.

# Own variable name: other sites on the host may already define $connection_upgrade.
map $http_upgrade $sbts_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name ics.ridelogic.in;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append: the container trusts X-Real-IP from here.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Live tracking WebSocket (the API pings every 25 s).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sbts_connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
