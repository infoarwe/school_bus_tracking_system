openapi: 3.1.0
info:
  title: School Bus Tracking API
  version: 0.10.2
  description: |
    API for the School Bus Tracking admin web and the Android Driver and Parent apps.

    ## Conventions
    - Base path for business endpoints: `/api/v1`. JSON fields are `snake_case`.
    - Timestamps are RFC 3339 UTC (`2026-10-07T02:15:00Z`); calendar dates are `YYYY-MM-DD`.
    - Mobile numbers are accepted as `9876543210`, `+91 98765 43210`, etc. and always returned as `+919876543210`.
    - Success responses wrap the payload: `{"data": ...}`. Lists add
      `"meta": {"page", "page_size", "total"}` and accept `?page=1&page_size=20` (max 100).
    - Errors: `{"error": {"code", "message", "fields"}}`. Branch on `code`, show `message`.
    - Every response carries an `X-Request-ID` header; include it when reporting a bug.

    ## Authentication
    - **Driver and Parent apps:** `POST /auth/otp/send` then `POST /auth/otp/verify` with `app` = `driver` or `parent`.
      On the dev environment every code is `123456` (no SMS is sent).
    - **Admin web:** `POST /auth/login` (email + password). If the response has `mfa_required: true`,
      call `POST /auth/login/2fa` with the `mfa_token` and the authenticator code.
    - Send `Authorization: Bearer <access_token>` on every other call.
    - Access tokens last `expires_in` seconds (15 min). On `401`, call `POST /auth/refresh` once with the
      refresh token; it returns a **new** refresh token and the old one stops working, so always store the
      latest one. If refresh fails, send the user to login.
    - Refresh tokens last 30 days. Store them in secure storage (Android Keystore / EncryptedSharedPreferences).

    ## Live tracking (Driver app → server → Parent app / admin web)

    ### Driver app: sending GPS
    - After a successful `POST /driver/trips/{id}/start`, run a foreground location service and send fixes to
      `POST /driver/trips/{id}/locations` in batches (`points`, 1–100). Every 5–10 s is enough.
    - Send `latitude`, `longitude`, `accuracy_m`, `recorded_at` (device time, RFC 3339 UTC) and, when available,
      `speed_mps` and `heading`.
    - **Offline:** keep points in a local queue and send them oldest first when the network returns. Re-sending
      points the server already has is harmless (they are rejected as duplicates).
    - The server drops implausible fixes (accuracy worse than 100 m, jumps faster than 150 km/h, future or >6 h old
      timestamps) and lists them in `rejected`; do not retry rejected points.
    - `409 trip_not_started`: the trip was ended or cancelled (possibly by the school). **Stop the location service.**
    - `503 live_unavailable`: keep the points queued and retry with back-off.
    - Stop sending after `POST /driver/trips/{id}/end`. GPS is only accepted while a trip is in progress.

    ### WebSocket: receiving live updates
    Connect to `wss://<host>/api/v1/ws?access_token=<access token>` (a Super Admin also adds `&school_id=`).
    A bad or expired token fails the handshake with HTTP 401: refresh the token and reconnect.

    Send JSON text messages:

    | Message | Who | Effect |
    |---|---|---|
    | `{"type":"subscribe","channel":"trip","trip_id":"…"}` | Parent (a trip their child rides), Driver (own trip), staff (own school) | Events for that trip |
    | `{"type":"subscribe","channel":"school"}` | Staff only | Events for every trip of the school |
    | `{"type":"unsubscribe","channel":"trip","trip_id":"…"}` | | Stop |
    | `{"type":"ping"}` | | Server replies `{"type":"pong"}` |

    Replies and events:
    - `{"type":"subscribed","channel":"trip","trip_id":"…","status":"started","snapshot":[BusLocation]}`
      (`snapshot` holds the latest position, if any; for `school` it holds every bus in progress).
    - `{"type":"location","trip_id":"…","location":BusLocation}`: new position.
    - `{"type":"trip_status","trip_id":"…","status":"started|completed|cancelled|…"}`: refresh the trip.
    - `{"type":"bus_stale","trip_id":"…","location":BusLocation}`: no GPS for longer than the school's limit
      (show "last seen …"); the next `location` has `stale: false`.
    - `{"type":"error","code":"forbidden|not_found|bad_request","message":"…"}`: a trip the caller may not
      watch is always `not_found`.

    The server pings every 25 s and re-checks the session every minute; a session that was logged out or
    suspended is closed with close code **4401**: log in again. On any other disconnect, reconnect with back-off
    (1 s, 2 s, 4 s … max 30 s) and subscribe again. The Parent app should subscribe to the trip from
    `GET /parent/children/{id}/trips` whose status is `started`.

    ### Stop status and ETA (computed by the server from GPS)
    - Each stop of a trip in progress is `upcoming` → `approaching` (bus within the school's approach distance,
      default 1 km) → `reached` (bus inside the stop's circle for 2 fixes in a row) → `crossed` (left the circle).
      A stop the bus passes without entering is `crossed` with `missed: true`. Apps never set these.
    - **Order:** Morning Pickup visits stops 1 → N and then the school (`stop_id: "school"`, event `school_reached`);
      Evening Drop runs N → 1.
    - **ETA** (`eta_seconds`, `distance_m`) is from the bus's current position to each stop ahead (rule 9): Google
      traffic-aware when the school has set its Google server key, otherwise an estimate (`eta_source`).
    - **Parent app:** call `GET /parent/children/{id}/live` when opening the tracking screen (and when switching
      child), then subscribe to `trip.id` on the WebSocket and update from `location` and `progress` events (find
      the child's `child_stop.stop_id` in `progress.stops`). On `trip_status`, call `/live` again.
    - Extra WebSocket events: `{"type":"stop_status","trip_id":"…","stop":{"stop_id","type","missed","at"}}`
      when a stop changes, and `{"type":"progress","trip_id":"…","progress":TripProgress}` after every location.
      Example display: `Bus: TN-38-AB-1234 | Status: Moving | ETA: 8 minutes | Distance: 2.4 km`.

    ## Push notifications (FCM)
    - **Each school has its own branded apps and its own Firebase project.** Build each school's app with
      that school's `google-services.json`; the school uploads the matching service-account key in the admin web
      (Settings → Push notifications), and the server sends that school's pushes through it.
    - After login, and whenever FCM issues a new token, call `POST /devices` with `{token, platform}`. The device
      is tied to that login: after logout or suspension it receives nothing. `POST /devices/unregister` removes it.
    - Pushes are FCM messages with `notification` (title, body) and `data`. Android: channel `bus_updates`, high
      priority. Every push has `data.type` and `data.notification_id`; trip pushes add `trip_id`, `route_id`,
      `trip_type`, stop pushes add `stop_id`, child-specific pushes add `student_ids` (comma-separated: open that
      child; with several, the title starts with their names, e.g. `Asha, Arjun · Bus approaching`).
    - `data.type` values: `bus_started`, `bus_approaching`, `bus_reached`, `bus_crossed`, `bus_delayed`,
      `bus_breakdown`, `school_reached`, `trip_completed`, `trip_cancelled`, `announcement` (adds `announcement_id`,
      `category` and optionally `attachment_url`).
    - Parents receive stop pushes only for their own child's stop, and each event at most once.
    - The inbox (`GET /parent/notifications`) holds the same items; mark them read with
      `POST /parent/notifications/read`. `meta.unread` is the badge count.
    - **Driver app:** report a delay or breakdown with `POST /driver/trips/{id}/delays` (parents of the trip are
      notified), and an emergency with `POST /driver/trips/{id}/emergency` (the school's staff are alerted at once;
      parents are not notified automatically).

    ## Rate limits
    Over a limit the API answers `429` with code `rate_limited` and a `Retry-After` header (seconds). Wait that long
    before retrying; never retry in a tight loop. Default limits (the server may be configured differently):

    | Scope | Limit |
    |---|---|
    | Every `/api/v1` request, per client IP | 1200 per minute |
    | Every authenticated request, per user | 600 per minute |
    | `/auth/login`, `/auth/login/2fa`, `/auth/otp/send`, `/auth/otp/verify`, `/auth/refresh` together, per client IP | 60 per 15 minutes |
    | `/auth/otp/send`, per client IP | 20 per hour (plus `otp_too_soon` / `otp_rate_limited` per number) |
    | Password and 2FA attempts, per account | 10 per 15 minutes |
    | `/auth/otp/verify`, per mobile number and app | 10 per 15 minutes |

    The Driver app's GPS upload (one batch every 5–10 s) is far below these limits. `/health` is not limited.

    ## Error codes you should handle
    | Code | Status | Meaning |
    |---|---|---|
    | `validation_failed` | 400 | See `fields` for per-field messages. |
    | `unauthorized`, `token_invalid`, `session_revoked` | 401 | Try refresh once, else go to login. |
    | `refresh_token_invalid` | 401 | Go to login. |
    | `invalid_credentials`, `otp_invalid`, `otp_attempts_exceeded`, `invalid_2fa_code`, `mfa_token_invalid` | 401 | Show message. |
    | `account_suspended`, `school_inactive` | 403 | Show message, log out. |
    | `forbidden` | 403 | Role not allowed. |
    | `2fa_setup_required` | 403 | Super Admin must set up 2FA first. |
    | `not_found` | 404 | Missing or belongs to another school. |
    | `conflict` | 409 | Duplicate; see `fields`. |
    | `otp_too_soon`, `otp_rate_limited` | 429 | Wait before requesting another code. |
    | `rate_limited` | 429 | Too many requests: wait `Retry-After` seconds, then retry (see Rate limits). |
    | `invalid_upload` | 400 | A file upload was not `multipart/form-data`. |
    | `invalid_transition`, `not_trip_day`, `another_trip_in_progress`, `status_changed` | 409 | Trip action not allowed now; refresh the trip. |
    | `driver_profile_missing` | 404 | Driver login has no driver profile; contact the school. |
    | `trip_not_started` | 409 | Stop sending GPS: the trip is not in progress. |
    | `live_unavailable` | 503 | Keep GPS points queued and retry. |

    ## Changelog
    - 0.10.2 (S9-04): new web passwords are limited to 72 bytes (`400 validation_failed`, was a 500); ending a session is
      audited. Admin web only; no mobile-facing change.
    - 0.10.1 (S9-01): rate limits (see Rate limits): new `429 rate_limited` error with a `Retry-After` header on any
      endpoint. No request or response format changed.
    - 0.10.0 (S8-09): **mobile handoff 7**: `GET /branding` (the caller's school's app name, colours and logo) and
      `GET /branding/logos/{file}` (no token). Admin: Settings → App branding (name, colours, logo upload).
    - 0.9.0 (Sprint 8): dashboard, reports (JSON + CSV), trip GPS track, audit log viewer, school deactivation confirm, default stop radius.
    - 0.8.1: per-school Firebase key (Settings → Push notifications); each school's apps use their own Firebase project.
    - 0.8.0 (Sprint 7): **mobile handoff 6**: `POST /devices`, push payloads (see Push notifications), parent inbox,
      `POST /driver/trips/{id}/delays`, `POST /driver/trips/{id}/emergency`. Admin: alerts, announcements.
    - 0.7.0 (Sprint 6): **mobile handoff 5**: `GET /parent/children/{id}/live`; WebSocket `stop_status` and `progress` events;
      `GET /driver/trips/{id}/progress`. Admin: trip progress, approach distance and school location in tracking settings.
    - 0.6.0 (Sprint 5): **mobile handoff 4**: `POST /driver/trips/{id}/locations`, WebSocket `/api/v1/ws` (see Live tracking).
      Admin: live snapshot, tracking settings (GPS history retention, offline threshold).
    - 0.5.0 (Sprint 4): **mobile handoff 3**: `GET /driver/trips`, `GET /driver/trips/{id}`, `POST .../confirm|start|end`;
      Parent app: `GET /parent/children/{id}/trips`. Admin: daily trips, copy, cancel, override; per-school maps keys.
    - 0.4.0 (Sprint 3): **mobile handoff 2**: `GET /driver/me`, `GET /parent/children`, `GET /parent/children/{id}`.
      Admin: students, parents, route/stop assignment with history, CSV import.
    - 0.3.0 (Sprint 2): drivers, buses, routes, stops (admin web).
    - 0.2.0 (Sprint 1): auth (password, 2FA, OTP, refresh, logout, me, sessions), schools, school users.
    - 0.1.0: `/health`.
servers:
  - url: /
    description: This server
tags:
  - name: Auth
    description: Login for web (email + password) and apps (mobile + OTP).
  - name: Schools
    description: Tenants. Super Admin manages them; staff can read their own school.
  - name: School users
    description: School Admins and Transport Managers of one school.
  - name: Drivers
  - name: Buses
  - name: Routes & stops
    description: Routes with ordered stops. Stop sequence is always 1..N.
  - name: Driver app
    description: Caller-scoped endpoints for the Driver app.
  - name: Parent app
    description: Caller-scoped endpoints for the Parent app. Only linked children are ever returned.
  - name: Students
  - name: Parents
  - name: Trips
    description: Daily assignments (Driver + Bus + Route + Date + Trip Type).
  - name: Live tracking
    description: Current bus positions and the WebSocket.
  - name: Notifications
  - name: Alerts
    description: Delays, breakdowns and emergencies.
  - name: Announcements
  - name: Dashboard & reports
  - name: Audit
  - name: Settings
  - name: Branding
    description: Each school's app name, colours and logo for its white-label apps.
  - name: System
security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [System]
      summary: Service health
      operationId: getHealth
      security: []
      responses:
        "200":
          description: All dependencies are up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthEnvelope" }
              example: { data: { status: ok, checks: { postgres: up, redis: up } } }
        "503":
          description: At least one dependency is down.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthEnvelope" }

  /api/v1/auth/otp/send:
    post:
      tags: [Auth]
      summary: Send a login OTP (Driver / Parent app)
      description: |
        Sends a 6-digit code by SMS, valid for `expires_in` seconds. The answer is the same whether or not
        the number is registered. Limits: one request per 30 s and 5 per hour per number.
      operationId: sendOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mobile, app]
              properties:
                mobile: { type: string, example: "9000000001" }
                app: { type: string, enum: [driver, parent] }
      responses:
        "200":
          description: Code sent (if the number is registered for that app).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sent: { type: boolean }
                      expires_in: { type: integer, description: seconds }
              example: { data: { sent: true, expires_in: 300 } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify OTP and log in (Driver / Parent app)
      description: A code works once. After 5 wrong attempts the code is cancelled; request a new one.
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mobile, app, code]
              properties:
                mobile: { type: string, example: "9000000001" }
                app: { type: string, enum: [driver, parent] }
                code: { type: string, example: "123456" }
                device_name: { type: string, description: Shown in the user's session list., example: "Pixel 7" }
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Tokens" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in with email + password (admin web)
      description: For Super Admin, School Admin and Transport Manager. Drivers and parents use OTP.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                device_name: { type: string }
      responses:
        "200":
          description: Logged in, or a 2FA code is needed (`mfa_required`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/LoginResult" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/auth/login/2fa:
    post:
      tags: [Auth]
      summary: Complete login with an authenticator code
      operationId: login2fa
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfa_token, code]
              properties:
                mfa_token: { type: string, description: From the login response. Valid 5 minutes. }
                code: { type: string, example: "492039" }
                device_name: { type: string }
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/LoginResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Get new tokens
      description: Returns a new access token **and a new refresh token**. The old refresh token stops working.
      operationId: refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New tokens.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Tokens" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Log out this device
      operationId: logout
      responses:
        "204": { description: Session ended. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Current user and school
      description: Call after login and on app start.
      operationId: getMe
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [user, school, two_factor_setup_required]
                    properties:
                      user: { $ref: "#/components/schemas/User" }
                      school:
                        oneOf:
                          - $ref: "#/components/schemas/School"
                          - type: "null"
                        description: Null for Super Admin.
                      two_factor_setup_required: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/auth/sessions:
    get:
      tags: [Auth]
      summary: My active sessions (devices)
      operationId: listSessions
      responses:
        "200":
          description: Sessions, most recently used first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }

  /api/v1/auth/sessions/{sessionID}:
    delete:
      tags: [Auth]
      summary: Log out one of my devices
      operationId: revokeSession
      parameters:
        - { name: sessionID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Session ended. }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/auth/2fa/setup:
    post:
      tags: [Auth]
      summary: Start authenticator (2FA) setup (web roles)
      description: Returns a secret and QR code to scan. 2FA is not active until `/auth/2fa/enable` succeeds.
      operationId: setupTotp
      responses:
        "200":
          description: Scan the QR code with an authenticator app.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      secret: { type: string }
                      otpauth_url: { type: string }
                      qr_code_png: { type: string, description: "data: URL of a PNG" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/auth/2fa/enable:
    post:
      tags: [Auth]
      summary: Confirm a code and turn 2FA on
      operationId: enableTotp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "204": { description: 2FA is on. Future logins need a code. }
        "400": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/schools:
    get:
      tags: [Schools]
      summary: List schools (Super Admin)
      operationId: listSchools
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { name: q, in: query, description: Search name or code, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
      responses:
        "200":
          description: Schools, by name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/School" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Schools]
      summary: Create a school (Super Admin)
      operationId: createSchool
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/School" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/schools/{schoolID}:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
    get:
      tags: [Schools]
      summary: Get a school (Super Admin, or staff of that school)
      operationId: getSchool
      responses:
        "200":
          description: The school.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/School" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Schools]
      summary: Update a school (Super Admin)
      operationId: updateSchool
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/School" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/schools/{schoolID}/status:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
    patch:
      tags: [Schools]
      summary: Activate or deactivate a school (Super Admin)
      description: Users of an inactive school are logged out and cannot log in.
      operationId: setSchoolStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, inactive] }
                confirm_code: { type: string, description: "Required to deactivate: the school's code, typed to confirm." }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/School" }

  /api/v1/schools/{schoolID}/users:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
    get:
      tags: [School users]
      summary: List School Admins and Transport Managers (Super Admin, School Admin)
      operationId: listSchoolUsers
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { name: role, in: query, schema: { type: string, enum: [school_admin, transport_manager] } }
