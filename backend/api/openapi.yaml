      operationId: listRoutes
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { name: q, in: query, description: Search name or code, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
      responses:
        "200":
          description: Routes, by code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Route" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
    post:
      tags: [Routes & stops]
      summary: Create a route
      operationId: createRoute
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RouteInput" }
      responses:
        "201":
          description: Created (with an empty `stops` list).
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Route" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/schools/{schoolID}/routes/{routeID}:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
      - { $ref: "#/components/parameters/RouteID" }
    get:
      tags: [Routes & stops]
      summary: Get a route with its stops in order
      operationId: getRoute
      responses:
        "200":
          description: The route; `stops` sorted by `sequence`.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Route" } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Routes & stops]
      summary: Update a route
      operationId: updateRoute
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RouteInput" }
      responses:
        "200":
          description: Updated (without stops).
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Route" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/schools/{schoolID}/routes/{routeID}/status:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
      - { $ref: "#/components/parameters/RouteID" }
    patch:
      tags: [Routes & stops]
      summary: Activate or deactivate a route
      operationId: setRouteStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties: { status: { type: string, enum: [active, inactive] } }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Route" } } }

  /api/v1/schools/{schoolID}/routes/{routeID}/stops:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
      - { $ref: "#/components/parameters/RouteID" }
    post:
      tags: [Routes & stops]
      summary: Add a stop
      description: Appends to the end, or inserts at `position` and shifts later stops down.
      operationId: createStop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/StopInput"
                - type: object
                  properties:
                    position: { type: integer, minimum: 1, description: "1-based; omit to append." }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Stop" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/schools/{schoolID}/routes/{routeID}/stops/order:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
      - { $ref: "#/components/parameters/RouteID" }
    put:
      tags: [Routes & stops]
      summary: Reorder stops
      description: Send every stop ID of the route, once each, in the new travel order.
      operationId: reorderStops
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stop_ids]
              properties:
                stop_ids: { type: array, items: { type: string, format: uuid } }
      responses:
        "200":
          description: Stops in the new order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Stop" } }
        "400": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/schools/{schoolID}/routes/{routeID}/stops/{stopID}:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
      - { $ref: "#/components/parameters/RouteID" }
      - { name: stopID, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Routes & stops]
      summary: Update a stop
      description: Position is not changed here; use the reorder endpoint.
      operationId: updateStop
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StopInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Stop" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Routes & stops]
      summary: Delete a stop
      description: Later stops move up so the sequence stays 1..N.
      operationId: deleteStop
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/driver/me:
    get:
      tags: [Driver app]
      summary: My driver profile
      description: |
        The logged-in driver's own profile. Today's trips, bus and route come with the trip endpoints (Sprint 4).
        `404 driver_profile_missing` means the login exists but the school has not set up the driver profile.
      operationId: getDriverMe
      responses:
        "200":
          description: The driver.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Driver" } } }
              example:
                data:
                  id: 3c1e0000-0000-4000-8000-000000000010
                  school_id: 4f1d2a3b-0000-4000-8000-000000000002
                  user_id: 9b6c1c2e-0000-4000-8000-000000000001
                  name: Kumar
                  mobile: "+919000000001"
                  license_number: TN3820190001234
                  license_expiry: "2030-01-31"
                  address: ""
                  emergency_contact_name: ""
                  emergency_contact_phone: ""
                  id_proof_type: ""
                  id_proof_number: ""
                  notes: ""
                  status: active
                  last_login_at: "2026-10-07T01:30:00Z"
                  created_at: "2026-10-01T09:00:00Z"
                  updated_at: "2026-10-01T09:00:00Z"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/parent/children:
    get:
      tags: [Parent app]
      summary: My children
      description: |
        Active students linked to the logged-in parent, each with their current route and stops
        (`assignment` is null if the school has not assigned a route yet). Show this list after login;
        switching child should reload everything for that child.
      operationId: listParentChildren
      responses:
        "200":
          description: Linked children, by name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ParentChild" } }
              example:
                data:
                  - student_id: 7a2b0000-0000-4000-8000-000000000020
                    name: Asha Ravi
                    admission_no: DPS-1001
                    class: "5"
                    section: A
                    assignment:
                      id: 1d000000-0000-4000-8000-000000000030
                      route_id: 5e000000-0000-4000-8000-000000000040
                      route_code: RS-01
                      route_name: Gandhipuram - Singanallur
                      pickup_stop: { id: 6f000000-0000-4000-8000-000000000050, name: Peelamedu, sequence: 2, latitude: 11.0285, longitude: 77.0028, pickup_time: "07:25", drop_time: "16:25" }
                      drop_stop: { id: 6f000000-0000-4000-8000-000000000050, name: Peelamedu, sequence: 2, latitude: 11.0285, longitude: 77.0028, pickup_time: "07:25", drop_time: "16:25" }
                      assigned_by_name: Demo School Admin
                      assigned_at: "2026-10-01T09:00:00Z"
                      ended_at: null
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/parent/children/{studentID}:
    parameters:
      - { $ref: "#/components/parameters/StudentID" }
    get:
      tags: [Parent app]
      summary: One child, with their route's stops
      description: |
        Same as the list entry plus `route_stops`: all stops of the child's route in travel order, to draw the route
        on the map. A student not linked to this parent returns 404.
      operationId: getParentChild
      responses:
        "200":
          description: The child.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/ParentChild"
                      - type: object
                        required: [route_stops]
                        properties:
                          route_stops: { type: array, items: { $ref: "#/components/schemas/Stop" } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/schools/{schoolID}/students:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
    get:
      tags: [Students]
      summary: List students (Transport Manager may view)
      description: Each student includes the current `assignment`. Transport Managers do not receive `notes`.
      operationId: listStudents
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { name: q, in: query, description: Search name or admission number, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { name: transport_status, in: query, schema: { type: string, enum: [uses_transport, not_using] } }
        - { name: class, in: query, schema: { type: string } }
        - { name: section, in: query, schema: { type: string } }
        - { name: route_id, in: query, schema: { type: string, format: uuid } }
        - { name: assigned, in: query, description: Only students with (yes) or without (no) a route, schema: { type: string, enum: ["yes", "no"] } }
      responses:
        "200":
          description: Students, by class, section, name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Student" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
    post:
      tags: [Students]
      summary: Create a student (Super Admin, School Admin)
      operationId: createStudent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Student" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/schools/{schoolID}/students/classes:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
    get:
      tags: [Students]
      summary: Distinct class values (for filters)
      operationId: listStudentClasses
      responses:
        "200":
          description: Classes in use.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { type: string } } } }

  /api/v1/schools/{schoolID}/students/import:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
    post:
      tags: [Students]
      summary: Import students and parents from CSV (Super Admin, School Admin)
      description: |
        Columns (header row, any order, case-insensitive): `admission_no`*, `student_name`*, `class`, `section`,
        `parent_name`, `parent_mobile`, `parent_relationship`, `parent2_name`, `parent2_mobile`, `parent2_relationship`,
        `route_code`, `pickup_stop`, `drop_stop`. Stops are matched by name or stop number. Max 2000 rows / 2 MB.

        **All or nothing:** if any row has an error nothing is saved and every error is returned.
        Existing students (same admission number) are updated; parents are matched by mobile.
      operationId: importStudents
      parameters:
        - { name: dry_run, in: query, description: Validate only, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Result. `imported` is true only if the data was saved.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/ImportResult" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/schools/{schoolID}/students/{studentID}:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
      - { $ref: "#/components/parameters/StudentID" }
    get:
      tags: [Students]
      summary: Get a student with linked parents
      operationId: getStudent
      responses:
        "200":
          description: The student.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Student" } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Students]
      summary: Update a student
      description: Setting `transport_status` to `not_using` ends the route assignment.
      operationId: updateStudent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Student" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/schools/{schoolID}/students/{studentID}/status:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
      - { $ref: "#/components/parameters/StudentID" }
    patch:
      tags: [Students]
      summary: Activate or deactivate a student
      operationId: setStudentStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties: { status: { type: string, enum: [active, inactive] } }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Student" } } }

  /api/v1/schools/{schoolID}/students/{studentID}/assignment:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
      - { $ref: "#/components/parameters/StudentID" }
    put:
      tags: [Students]
      summary: Assign route and stops
      description: |
        Stops must belong to the route. A pickup stop is required if the route runs Morning Pickup and must be empty
        otherwise; the same for the drop stop and Evening Drop. The previous assignment is kept as history.
      operationId: assignStudent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [route_id]
              properties:
                route_id: { type: string, format: uuid }
                pickup_stop_id: { type: [string, "null"], format: uuid }
                drop_stop_id: { type: [string, "null"], format: uuid }
      responses:
        "200":
          description: The student with the new assignment.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Student" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Students]
      summary: Remove from route
      operationId: unassignStudent
      responses:
        "204": { description: Removed (kept as history). }

  /api/v1/schools/{schoolID}/students/{studentID}/assignments:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
      - { $ref: "#/components/parameters/StudentID" }
    get:
      tags: [Students]
      summary: Assignment history
      operationId: listStudentAssignments
      responses:
        "200":
          description: Newest first; the current one has `ended_at` null.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/StudentAssignment" } } } }

  /api/v1/schools/{schoolID}/routes/{routeID}/students:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
      - { $ref: "#/components/parameters/RouteID" }
    get:
      tags: [Routes & stops]
      summary: Students currently assigned to a route
      operationId: listRouteStudents
      responses:
        "200":
          description: Active students with their pickup and drop stop IDs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        student_id: { type: string, format: uuid }
                        name: { type: string }
                        admission_no: { type: string }
                        class: { type: string }
                        section: { type: string }
                        pickup_stop_id: { type: [string, "null"], format: uuid }
                        drop_stop_id: { type: [string, "null"], format: uuid }

  /api/v1/schools/{schoolID}/parents:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
    get:
      tags: [Parents]
      summary: List parents (Transport Manager may view)
      operationId: listParents
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { name: q, in: query, description: "Search parent name, mobile, child name or admission number", schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
      responses:
        "200":
          description: Parents with linked children, by name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Parent" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
    post:
      tags: [Parents]
      summary: Create a parent (Super Admin, School Admin)
      description: Also creates the parent's app login (mobile + OTP) and links the children.
      operationId: createParent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParentInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Parent" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/schools/{schoolID}/parents/{parentID}:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
      - { name: parentID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Parents]
      summary: Get a parent
      operationId: getParent
      responses:
        "200":
          description: The parent.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Parent" } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Parents]
      summary: Update a parent and replace their linked children
      operationId: updateParent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParentInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Parent" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/schools/{schoolID}/parents/{parentID}/status:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
      - { name: parentID, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Parents]
      summary: Activate or deactivate a parent
      description: An inactive parent is logged out of the app and cannot log in.
      operationId: setParentStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties: { status: { type: string, enum: [active, inactive] } }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Parent" } } }

  /api/v1/driver/trips:
    get:
      tags: [Driver app]
      summary: My trips for a day
      description: |
        The logged-in driver's own trips for `date` (default: today in the school's time zone), Morning Pickup first.
        Cancelled trips are not listed. Each trip includes the route's ordered `stops`, each with `student_count`
        (how many students board there for Morning Pickup, or get off for Evening Drop). Drivers never get student names.

        **Trip status flow for the Driver app:** `scheduled` → **confirm** → `confirmed` → **start** (only on the trip's
        date) → `started` → **end** → `completed`. A trip can also become `cancelled` by the school at any time before
        it starts, or be changed by an admin override; refresh the list when the app resumes.
        Start GPS sharing only after a successful **start**, and stop it after **end** (Sprint 5).
      operationId: listDriverTrips
      parameters:
        - { name: date, in: query, description: "YYYY-MM-DD; default today", schema: { type: string, format: date } }
      responses:
        "200":
          description: Trips with stops.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/DriverTrip" } }
              example:
                data:
                  - id: 8a000000-0000-4000-8000-000000000060
                    school_id: 4f1d2a3b-0000-4000-8000-000000000002
                    trip_date: "2026-10-07"
                    trip_type: morning_pickup
                    status: scheduled
                    route: { id: 5e000000-0000-4000-8000-000000000040, code: RS-01, name: Gandhipuram - Singanallur, stop_count: 4 }
                    bus: { id: 9c000000-0000-4000-8000-000000000070, vehicle_number: TN-38-AB-1234, capacity: 40 }
                    driver: { id: 3c1e0000-0000-4000-8000-000000000010, name: Kumar, mobile: "+919000000001" }
                    student_count: 3
                    notes: ""
                    cancel_reason: ""
                    confirmed_at: null
                    started_at: null
                    ended_at: null
                    cancelled_at: null
                    created_at: "2026-10-06T12:00:00Z"
                    updated_at: "2026-10-06T12:00:00Z"
                    stops:
                      - { id: 6f000000-0000-4000-8000-000000000049, route_id: 5e000000-0000-4000-8000-000000000040, name: Gandhipuram, landmark: "", latitude: 11.0168, longitude: 76.9663, sequence: 1, pickup_time: "07:10", drop_time: "16:40", geofence_radius_m: 100, student_count: 0, created_at: "2026-10-01T09:00:00Z", updated_at: "2026-10-01T09:00:00Z" }
                      - { id: 6f000000-0000-4000-8000-000000000050, route_id: 5e000000-0000-4000-8000-000000000040, name: Peelamedu, landmark: "", latitude: 11.0285, longitude: 77.0028, sequence: 2, pickup_time: "07:25", drop_time: "16:25", geofence_radius_m: 100, student_count: 2, created_at: "2026-10-01T09:00:00Z", updated_at: "2026-10-01T09:00:00Z" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/driver/trips/{tripID}:
    parameters:
      - { $ref: "#/components/parameters/TripID" }
    get:
      tags: [Driver app]
      summary: One of my trips
      description: Another driver's trip returns 404.
      operationId: getDriverTrip
      responses:
        "200":
          description: The trip with stops.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/DriverTrip" } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/driver/trips/{tripID}/confirm:
    parameters:
      - { $ref: "#/components/parameters/TripID" }
    post:
      tags: [Driver app]
      summary: Confirm a trip (scheduled → confirmed)
      description: The driver accepts the assignment. Allowed for today's and future trips.
      operationId: confirmDriverTrip
      responses:
        "200":
          description: The updated trip.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/DriverTrip" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TripStateConflict" }

  /api/v1/driver/trips/{tripID}/start:
    parameters:
      - { $ref: "#/components/parameters/TripID" }
    post:
      tags: [Driver app]
      summary: Start a trip (confirmed → started)
      description: |
        Only on the trip's date (`409 not_trip_day` otherwise) and only one trip in progress per driver
        (`409 another_trip_in_progress`). A scheduled trip must be confirmed first (`409 invalid_transition`).
      operationId: startDriverTrip
      responses:
        "200":
          description: The started trip.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/DriverTrip" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TripStateConflict" }

  /api/v1/driver/trips/{tripID}/end:
    parameters:
      - { $ref: "#/components/parameters/TripID" }
    post:
      tags: [Driver app]
      summary: End a trip (started → completed)
      operationId: endDriverTrip
      responses:
        "200":
          description: The completed trip.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/DriverTrip" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TripStateConflict" }

  /api/v1/parent/children/{studentID}/trips:
    parameters:
      - { $ref: "#/components/parameters/StudentID" }
    get:
      tags: [Parent app]
      summary: The child's trips for a day
      description: |
        Trips on the child's route for `date` (default today): Morning Pickup if the child has a pickup stop, Evening Drop
        if they have a drop stop. Includes cancelled trips so the app can say so. No driver mobile number is shared.
      operationId: listParentChildTrips
      parameters:
        - { name: date, in: query, description: "YYYY-MM-DD; default today", schema: { type: string, format: date } }
      responses:
        "200":
          description: Trips.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ParentTrip" } }
              example:
                data:
                  - { id: 8a000000-0000-4000-8000-000000000060, trip_date: "2026-10-07", trip_type: morning_pickup, status: started, bus_number: TN-38-AB-1234, driver_name: Kumar, started_at: "2026-10-07T01:35:00Z", ended_at: null, cancel_reason: "", child_stop_name: Peelamedu }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/schools/{schoolID}/trips:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
    get:
      tags: [Trips]
      summary: List trips
      operationId: listTrips
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: from, in: query, description: Range start (when date is not given), schema: { type: string, format: date } }
        - { name: to, in: query, description: Range end, schema: { type: string, format: date } }
        - { name: trip_type, in: query, schema: { type: string, enum: [morning_pickup, evening_drop] } }
        - { name: status, in: query, schema: { type: string, enum: [scheduled, confirmed, started, completed, cancelled] } }
        - { name: route_id, in: query, schema: { type: string, format: uuid } }
        - { name: driver_id, in: query, schema: { type: string, format: uuid } }
        - { name: bus_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Trips, newest date first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Trip" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
    post:
      tags: [Trips]
      summary: Create a daily assignment
      description: |
        Driver + Bus + Route + Date + Trip Type. On one date and trip type a route, a bus and a driver can each be in
        only one trip (`409 trip_conflict`, `fields` names which). Route, bus and driver must be active; the route must
        run the trip type and have stops; the date must be today to 90 days ahead (school time zone).
      operationId: createTrip
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TripInput" }
      responses:
        "201":
          description: Created (status scheduled).
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Trip" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/schools/{schoolID}/trips/copy:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
    post:
      tags: [Trips]
      summary: Copy a day's trips to other dates
      description: Copies that clash or whose route, bus or driver is no longer usable are skipped and listed.
      operationId: copyTrips
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_date, to_dates]
              properties:
                from_date: { type: string, format: date }
                to_dates: { type: array, minItems: 1, maxItems: 31, items: { type: string, format: date } }
                trip_types: { type: array, items: { type: string, enum: [morning_pickup, evening_drop] }, description: Default both. }
      responses:
        "200":
          description: Result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      created: { type: integer }
                      skipped:
                        type: array
                        items:
                          type: object
                          properties:
                            trip_date: { type: string }
                            trip_type: { type: string }
                            route_code: { type: string }
                            reason: { type: string }

  /api/v1/schools/{schoolID}/trips/{tripID}:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
      - { $ref: "#/components/parameters/TripID" }
    get:
      tags: [Trips]
      summary: Get a trip with status history and stops
      operationId: getTrip
      responses:
        "200":
          description: The trip.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/Trip"
                      - type: object
                        properties:
                          history: { type: array, items: { $ref: "#/components/schemas/TripStatusChange" } }
                          stops: { type: array, items: { $ref: "#/components/schemas/TripStop" } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Trips]
      summary: Change a trip that has not started
      description: A confirmed trip goes back to scheduled when the driver changes.
      operationId: updateTrip
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TripInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Trip" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "409": { $ref: "#/components/responses/TripStateConflict" }

  /api/v1/schools/{schoolID}/trips/{tripID}/cancel:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
      - { $ref: "#/components/parameters/TripID" }
    post:
      tags: [Trips]
      summary: Cancel a trip that has not started
      operationId: cancelTrip
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, maxLength: 500 } } }
      responses:
        "200":
          description: Cancelled.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Trip" } } }
        "409": { $ref: "#/components/responses/TripStateConflict" }

  /api/v1/schools/{schoolID}/trips/{tripID}/override:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
      - { $ref: "#/components/parameters/TripID" }
    post:
      tags: [Trips]
      summary: Override a trip's status
      description: |
        For when the driver cannot (e.g. phone not working): `started` (scheduled/confirmed trip, today only),
        `completed` or `cancelled` (any trip not yet completed or cancelled). A reason is required; audited.
      operationId: overrideTrip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              properties:
                status: { type: string, enum: [started, completed, cancelled] }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Trip" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "409": { $ref: "#/components/responses/TripStateConflict" }

  /api/v1/schools/{schoolID}/settings/maps:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
    get:
      tags: [Settings]
      summary: The school's Google Maps keys (staff)
      description: The browser key is returned; the server key never is (only whether one is set and its last 4 characters).
      operationId: getMapsSettings
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/MapsSettings" } } }
    put:
      tags: [Settings]
      summary: Set the school's Google Maps keys (Super Admin, School Admin)
      description: "`server_key` omitted or null keeps the stored key; an empty string removes it. Stored encrypted."
      operationId: updateMapsSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                browser_key: { type: string, description: Empty to use OpenStreetMap. }
                server_key: { type: [string, "null"] }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/MapsSettings" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/driver/trips/{tripID}/locations:
    parameters:
      - { $ref: "#/components/parameters/TripID" }
    post:
      tags: [Driver app]
      summary: Send GPS fixes for my trip in progress
      description: See "Live tracking" in the introduction for batching, offline queueing and error handling.
      operationId: postDriverLocations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points]
              properties:
                points:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: "#/components/schemas/GpsPoint" }
            example:
              points:
                - { latitude: 11.0168, longitude: 76.9663, accuracy_m: 8, speed_mps: 7.5, heading: 82, recorded_at: "2026-10-07T01:40:05Z" }
                - { latitude: 11.0172, longitude: 76.9671, accuracy_m: 6, speed_mps: 8.1, heading: 80, recorded_at: "2026-10-07T01:40:10Z" }
      responses:
        "200":
          description: Accepted. Rejected points are listed with the reason; do not resend them.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accepted: { type: integer }
                      rejected:
                        type: array
                        items:
                          type: object
                          properties:
                            index: { type: integer, description: Position in the request's points array. }
                            reason: { type: string, example: accuracy worse than 100 m }
                      last_recorded_at: { type: [string, "null"], format: date-time }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`trip_not_started`: the trip is not in progress. Stop the location service."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`live_unavailable`: keep the points queued and retry."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/ws:
    get:
      tags: [Live tracking]
      summary: Live tracking WebSocket
      description: |
        Upgrade to a WebSocket. Protocol: see "Live tracking" in the introduction.
      operationId: liveSocket
      security: []
      parameters:
        - { name: access_token, in: query, required: true, schema: { type: string } }
        - { name: school_id, in: query, description: Super Admin only, schema: { type: string, format: uuid } }
      responses:
        "101": { description: Switched to WebSocket. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/schools/{schoolID}/live:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
    get:
      tags: [Live tracking]
      summary: Every bus with a trip in progress (staff)
      operationId: getLiveSnapshot
      responses:
        "200":
          description: Current positions.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/BusLocation" } } } }

  /api/v1/schools/{schoolID}/settings/tracking:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
    get:
      tags: [Settings]
      summary: GPS history retention and offline threshold (staff)
      operationId: getTrackingSettings
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/TrackingSettings" } } }
    put:
      tags: [Settings]
      summary: Change tracking settings (Super Admin, School Admin)
      operationId: updateTrackingSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrackingSettings" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/TrackingSettings" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/parent/children/{studentID}/live:
    parameters:
      - { $ref: "#/components/parameters/StudentID" }
    get:
      tags: [Parent app]
      summary: Tracking screen for one child
      description: |
        The child's most relevant trip today (in progress, else the next, else the last), where the bus is, and the
        status and ETA of the child's own stop. `trip` is null when the child has no trip today; `bus` is null until
        the bus sends GPS (and after the trip ends). After the trip, `child_stop` still shows how it went.
      operationId: getParentChildLive
      responses:
        "200":
          description: Live view.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/ParentLive" } } }
              example:
                data:
                  trip: { id: 8a000000-0000-4000-8000-000000000060, trip_date: "2026-10-07", trip_type: morning_pickup, status: started, bus_number: TN-38-AB-1234, driver_name: Kumar, started_at: "2026-10-07T01:35:00Z", ended_at: null, cancel_reason: "", child_stop_name: Peelamedu }
                  bus: { bus_number: TN-38-AB-1234, latitude: 11.0201, longitude: 76.9802, speed_mps: 7.9, heading: 75, state: moving, last_seen: "2026-10-07T01:48:12Z" }
                  child_stop: { stop_id: 6f000000-0000-4000-8000-000000000050, name: Peelamedu, status: approaching, missed: false, scheduled_time: "07:25", eta_seconds: 480, distance_m: 2400, reached_at: null, crossed_at: null }
                  eta_source: google
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/driver/trips/{tripID}/progress:
    parameters:
      - { $ref: "#/components/parameters/TripID" }
    get:
      tags: [Driver app]
      summary: Stop-by-stop progress of my trip
      operationId: getDriverTripProgress
      responses:
        "200":
          description: Progress, latest position and stop events.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/TripProgressResponse" } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/schools/{schoolID}/trips/{tripID}/progress:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
      - { $ref: "#/components/parameters/TripID" }
    get:
      tags: [Trips]
      summary: Stop-by-stop progress and event timeline
      description: "`progress` is live while the trip is in progress; `events` are kept after it ends."
      operationId: getTripProgress
      responses:
        "200":
          description: Progress, latest position and stop events.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/TripProgressResponse" } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/devices:
    post:
      tags: [Notifications]
      summary: Register this device for push (Driver / Parent app)
      operationId: registerDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token: { type: string, description: FCM registration token. }
                platform: { type: string, enum: [android, ios] }
      responses:
        "204": { description: Registered for the current login session. }
        "400": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/devices/unregister:
    post:
      tags: [Notifications]
      summary: Stop push to this device
      operationId: unregisterDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        "204": { description: Removed. }

  /api/v1/parent/notifications:
    get:
      tags: [Parent app]
      summary: Notification inbox
      description: Newest first. With `student_id`, that child's notifications plus the ones about no particular child.
      operationId: listParentNotifications
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { name: student_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Inbox items; `meta.unread` is the unread count for the same filter.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/InboxItem" } }
                  meta:
                    allOf:
                      - $ref: "#/components/schemas/PageMeta"
                      - type: object
                        properties: { unread: { type: integer } }
              example:
                data:
                  - id: 2b000000-0000-4000-8000-000000000090
                    type: bus_approaching
                    title: Bus approaching
                    body: "Bus is approaching your stop. Estimated arrival: 8 minutes."
                    data: { type: bus_approaching, trip_id: 8a000000-0000-4000-8000-000000000060, stop_id: 6f000000-0000-4000-8000-000000000050 }
                    student_id: 7a2b0000-0000-4000-8000-000000000020
                    student_name: Asha Ravi
                    read_at: null
                    created_at: "2026-10-07T01:47:00Z"
                meta: { page: 1, page_size: 20, total: 1, unread: 1 }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/parent/notifications/read:
    post:
      tags: [Parent app]
      summary: Mark inbox items read
      operationId: markParentNotificationsRead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties: { ids: { type: array, minItems: 1, maxItems: 200, items: { type: string, format: uuid } } }
      responses:
        "204": { description: Marked (IDs that are not the caller's are ignored). }

  /api/v1/driver/trips/{tripID}/delays:
    parameters:
      - { $ref: "#/components/parameters/TripID" }
    post:
      tags: [Driver app]
      summary: Report a delay or breakdown
      description: Parents of the students on this trip are notified (breakdown uses the breakdown message). Staff see it live.
      operationId: reportDriverDelay
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DelayInput" }
            example: { minutes: 15, reason: traffic, note: Signal not working at Gandhipuram }
      responses:
        "201":
          description: Recorded.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Alert" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TripStateConflict" }

  /api/v1/driver/trips/{tripID}/emergency:
    parameters:
      - { $ref: "#/components/parameters/TripID" }
    post:
      tags: [Driver app]
      summary: Report an emergency
      description: Alerts the school's staff immediately. Send the current position if available.
      operationId: reportDriverEmergency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string, maxLength: 1000 }
                latitude: { type: [number, "null"] }
                longitude: { type: [number, "null"] }
      responses:
        "201":
          description: Recorded and sent to staff.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Alert" } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/schools/{schoolID}/trips/{tripID}/delays:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
      - { $ref: "#/components/parameters/TripID" }
    post:
      tags: [Alerts]
      summary: Report a delay on a trip (staff)
      operationId: reportStaffDelay
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DelayInput" }
      responses:
        "201":
          description: Recorded; parents notified.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Alert" } } }

  /api/v1/schools/{schoolID}/alerts:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
    get:
      tags: [Alerts]
      summary: Unresolved emergencies and today's delays
      description: Also pushed live to staff as WebSocket `alert` events (school channel).
      operationId: listAlerts
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/Alert" } } } }

  /api/v1/schools/{schoolID}/emergencies/{emergencyID}/acknowledge:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
      - { name: emergencyID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Alerts]
      summary: Acknowledge an emergency
      operationId: acknowledgeEmergency
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Alert" } } }
        "409": { $ref: "#/components/responses/TripStateConflict" }

  /api/v1/schools/{schoolID}/emergencies/{emergencyID}/resolve:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
      - { name: emergencyID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Alerts]
      summary: Resolve an emergency
      operationId: resolveEmergency
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Alert" } } }

  /api/v1/schools/{schoolID}/announcements:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
    get:
      tags: [Announcements]
      summary: Announcement history and scheduled ones, with delivery stats
      operationId: listAnnouncements
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { name: status, in: query, schema: { type: string, enum: [scheduled, sent, cancelled] } }
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Announcement" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
    post:
      tags: [Announcements]
      summary: Send or schedule an announcement
      description: |
        `target: school` (all parents; Super Admin and School Admin only) or `target: route` with `route_id` (parents of
        that route's students; Transport Managers too). Without `scheduled_at` it is sent at once.
      operationId: createAnnouncement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, target, title, message]
              properties:
                category: { type: string, enum: [school_announcement, route_announcement, bus_breakdown, traffic_delay, pickup_change, emergency_message, holiday, other] }
                target: { type: string, enum: [school, route] }
                route_id: { type: [string, "null"], format: uuid }
                title: { type: string, maxLength: 100 }
                message: { type: string, maxLength: 1000 }
                attachment_url: { type: string, description: Optional link to a document or image. }
                scheduled_at: { type: [string, "null"], format: date-time }
      responses:
        "201":
          description: Created (and sent, unless scheduled).
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Announcement" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/schools/{schoolID}/announcements/{announcementID}/cancel:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
      - { name: announcementID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Announcements]
      summary: Cancel a scheduled announcement
      operationId: cancelAnnouncement
      responses:
        "200":
          description: Cancelled.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Announcement" } } }
        "409": { $ref: "#/components/responses/TripStateConflict" }

  /api/v1/schools/{schoolID}/settings/push:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
    get:
      tags: [Settings]
      summary: The school's Firebase project for push (Super Admin, School Admin)
      description: The key itself is never returned.
      operationId: getPushSettings
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/PushSettings" } } }
    put:
      tags: [Settings]
      summary: Upload the school's Firebase service-account key
      description: |
        The contents of the .json key from Firebase (Project settings → Service accounts → Generate new private key).
        Validated, then stored encrypted. Replaces any previous key.
      operationId: updatePushSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_account_json]
              properties:
                service_account_json: { type: string, maxLength: 16384, description: The key file's contents. }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/PushSettings" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [Settings]
      summary: Remove the school's Firebase key
      operationId: deletePushSettings
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/PushSettings" } } }

  /api/v1/schools/{schoolID}/settings/push/test:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
    post:
      tags: [Settings]
      summary: Check the stored key with Google
      operationId: testPushSettings
      responses:
        "200":
          description: "`ok` says whether Google accepted the key."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ok: { type: boolean }
                      message: { type: string }
        "409":
          description: "`push_not_configured`: no key uploaded."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/branding:
    get:
      tags: [Branding]
      summary: My school's app branding (Driver app, Parent app, school staff)
      description: |
        The app name, colours and logo of the caller's own school, for the school's white-label apps. Call it after
        login and on app start; `updated_at` changes whenever the school edits its branding. `null` colours or
        `logo_url` mean "use the app's built-in default". Show `display_name` (the app name, or the school name
        when none is set). Super Admin has no school and gets `403`.
      operationId: getMyBranding
      responses:
        "200":
          description: Branding.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Branding" } } }
              example:
                data:
                  school_id: 4f1d2a3b-0000-4000-8000-000000000002
                  school_name: Demo Public School
                  app_name: Demo School Bus
                  display_name: Demo School Bus
                  primary_color: "#1A73E8"
                  secondary_color: "#FFAA00"
                  logo_url: /api/v1/branding/logos/3f9c0a6e1b2d4c5e8f7a9b0c1d2e3f40.png
                  updated_at: "2026-10-10T05:30:00Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/branding/logos/{file}:
    parameters:
      - name: file
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9a-f]{32}\.(png|jpg)$' }
    get:
      tags: [Branding]
      summary: A school's logo image (no token needed)
      description: |
        Use `logo_url` from the branding response, prefixed with the API origin
        (e.g. `https://api.example.com` + `logo_url`). No `Authorization` header is needed, so any image loader works.
        The file name is random and never reused: cache the image for as long as `logo_url` is unchanged. A replaced or
        removed logo returns `404`.
      operationId: getBrandingLogo
      security: []
      responses:
        "200":
          description: The image (`image/png` or `image/jpeg`).
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/schools/{schoolID}/settings/branding:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
    get:
      tags: [Branding]
      summary: The school's app branding (staff)
      operationId: getBrandingSettings
      responses:
        "200":
          description: Branding.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Branding" } } }
    put:
      tags: [Branding]
      summary: Set the app name and colours (Super Admin, School Admin)
      description: Empty strings reset a field to the app default. Colours are returned upper-case. Audited.
      operationId: updateBrandingSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                app_name: { type: string, maxLength: 60 }
                primary_color: { type: string, pattern: '^(#[0-9A-Fa-f]{6})?$', example: "#1A73E8" }
                secondary_color: { type: string, pattern: '^(#[0-9A-Fa-f]{6})?$', example: "#FFAA00" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Branding" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/schools/{schoolID}/settings/branding/logo:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
    put:
      tags: [Branding]
      summary: Upload or replace the school's logo (Super Admin, School Admin)
      description: |
        `multipart/form-data` with one file field `logo`: PNG, JPEG or WebP, at most 1 MB by default
        (`UPLOAD_MAX_LOGO_BYTES`), 16–4096 pixels per side. The type is checked from the file's content, and the image
        is re-encoded before it is stored (metadata removed; WebP becomes PNG). The previous logo stops being served.
        Audited. Errors: `400 validation_failed` (`fields.logo`) or `400 invalid_upload` (not a multipart body).
      operationId: uploadBrandingLogo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo: { type: string, format: binary }
      responses:
        "200":
          description: Saved; `logo_url` is the new logo.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Branding" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Branding]
      summary: Remove the school's logo (Super Admin, School Admin)
      description: The apps show their built-in logo. Removing when there is none is not an error.
      operationId: deleteBrandingLogo
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: "#/components/schemas/Branding" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/schools/{schoolID}/dashboard:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
    get:
      tags: [Dashboard & reports]
      summary: School overview for today
      description: Totals, today's trips by type and status, live and offline buses, delays, emergencies, per-route summary.
      operationId: getDashboard
      responses:
        "200":
          description: Overview.
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, additionalProperties: true } } }

  /api/v1/schools/{schoolID}/reports:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
    get:
      tags: [Dashboard & reports]
      summary: Available reports (key, title, filters, columns)
      operationId: listReports
      responses:
        "200":
          description: Report definitions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string, enum: [trips, bus_journeys, driver_trips, route_performance, delays, assignments, notifications, location_history] }
                        title: { type: string }
                        description: { type: string }
                        filters: { type: array, items: { type: string } }
                        columns: { type: array, items: { type: object, properties: { key: { type: string }, label: { type: string } } } }

  /api/v1/schools/{schoolID}/reports/{report}:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
      - { name: report, in: path, required: true, schema: { type: string } }
    get:
      tags: [Dashboard & reports]
      summary: Run a report (JSON preview or CSV download)
      description: |
        Filters per report (see the list): `from`/`to` (YYYY-MM-DD, at most one year), `route_id`, `bus_id`, `driver_id`,
        `trip_id` (location history). JSON is paged (max 500 rows a page). `format=csv` downloads every row
        (UTF-8 with BOM for Excel; cells that look like formulas are prefixed with '). Exports are audit-logged.
      operationId: runReport
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: route_id, in: query, schema: { type: string, format: uuid } }
        - { name: bus_id, in: query, schema: { type: string, format: uuid } }
        - { name: driver_id, in: query, schema: { type: string, format: uuid } }
        - { name: trip_id, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Page" }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 20 } }
      responses:
        "200":
          description: "JSON: `data.report` (definition) and `data.rows` (arrays of strings in column order); or a CSV file."
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/schools/{schoolID}/trips/{tripID}/track:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
      - { $ref: "#/components/parameters/TripID" }
    get:
      tags: [Trips]
      summary: Stored GPS track of a trip (replay)
      operationId: getTripTrack
      responses:
        "200":
          description: Points in time order (empty if the school keeps no GPS history).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        latitude: { type: number }
                        longitude: { type: number }
                        speed_mps: { type: [number, "null"] }
                        recorded_at: { type: string, format: date-time }

  /api/v1/schools/{schoolID}/audit-logs:
    parameters:
      - { $ref: "#/components/parameters/SchoolID" }
    get:
      tags: [Audit]
      summary: The school's audit log
      description: Super Admin and School Admin see every entry of the school; a Transport Manager only transport entries (drivers, buses, routes, stops, trips, emergencies).
      operationId: listSchoolAuditLogs
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { name: action, in: query, description: "Prefix, e.g. trip. or user.suspend", schema: { type: string } }
        - { name: entity_type, in: query, schema: { type: string } }
        - { name: entity_id, in: query, schema: { type: string, format: uuid } }
        - { name: actor_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AuditRow" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }

  /api/v1/audit-logs:
    get:
      tags: [Audit]
      summary: Platform-wide audit log (Super Admin)
      description: Every school plus platform-level entries; `school_id` narrows to one school.
      operationId: listPlatformAuditLogs
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { name: school_id, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string } }
        - { name: entity_type, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AuditRow" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    SchoolID: { name: schoolID, in: path, required: true, schema: { type: string, format: uuid } }
    RouteID: { name: routeID, in: path, required: true, schema: { type: string, format: uuid } }
    StudentID: { name: studentID, in: path, required: true, schema: { type: string, format: uuid } }
    TripID: { name: tripID, in: path, required: true, schema: { type: string, format: uuid } }
    UserID: { name: userID, in: path, required: true, schema: { type: string, format: uuid } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }

  schemas:
    Branding:
      type: object
      required: [school_id, school_name, app_name, display_name, primary_color, secondary_color, logo_url, updated_at]
      properties:
        school_id: { type: string, format: uuid }
        school_name: { type: string }
        app_name: { type: string, description: 'As set by the school; "" = not set.' }
        display_name: { type: string, description: "The name to show: app_name, or the school name." }
        primary_color: { type: [string, "null"], description: "#RRGGBB, or null for the app default.", example: "#1A73E8" }
        secondary_color: { type: [string, "null"], description: "#RRGGBB, or null for the app default." }
        logo_url: { type: [string, "null"], description: "Path on the API origin; null = no logo." }
        updated_at: { type: [string, "null"], format: date-time }
    AuditRow:
      type: object
      properties:
        id: { type: string, format: uuid }
        school_id: { type: [string, "null"], format: uuid }
        school_name: { type: [string, "null"] }
        actor_id: { type: [string, "null"], format: uuid }
        actor_name: { type: [string, "null"] }
        actor_role: { type: string }
        action: { type: string, example: trip.started }
        entity_type: { type: string }
        entity_id: { type: [string, "null"], format: uuid }
        before: { description: State before (any JSON) }
        after: { description: State after (any JSON) }
        ip: { type: string }
        request_id: { type: string }
        created_at: { type: string, format: date-time }
    PushSettings:
      type: object
      properties:
        configured: { type: boolean }
        project_id: { type: string }
        client_email: { type: string }
        updated_at: { type: [string, "null"], format: date-time }
    InboxItem:
      type: object
      properties:
        id: { type: string, format: uuid, description: Inbox item ID (use to mark read). }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        data: { type: object, additionalProperties: { type: string } }
        student_id: { type: [string, "null"], format: uuid, description: Null when not about one child. }
        student_name: { type: [string, "null"] }
        read_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    DelayInput:
      type: object
      required: [minutes, reason]
      properties:
        minutes: { type: integer, minimum: 1, maximum: 240 }
        reason: { type: string, enum: [traffic, bus_breakdown, road_block, weather, driver_issue, other] }
        note: { type: string, maxLength: 500 }
    Alert:
      type: object
      description: A delay report or an emergency.
      properties:
        kind: { type: string, enum: [delay, emergency] }
        id: { type: string, format: uuid }
        trip_id: { type: string, format: uuid }
        trip_type: { type: string }
        route_code: { type: string }
        bus_number: { type: string }
        driver_name: { type: string }
        created_at: { type: string, format: date-time }
        reported_by: { type: [string, "null"] }
        minutes: { type: integer }
        reason: { type: string }
        note: { type: string }
        message: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        status: { type: string, enum: [open, acknowledged, resolved] }
        acknowledged_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }
    Announcement:
      type: object
      properties:
        id: { type: string, format: uuid }
        school_id: { type: string, format: uuid }
        category: { type: string }
        target: { type: string, enum: [school, route] }
        route_id: { type: [string, "null"], format: uuid }
        route_code: { type: [string, "null"] }
        title: { type: string }
        message: { type: string }
        attachment_url: { type: string }
        scheduled_at: { type: [string, "null"], format: date-time }
        status: { type: string, enum: [scheduled, sending, sent, cancelled] }
        sent_at: { type: [string, "null"], format: date-time }
        notification_id: { type: [string, "null"], format: uuid }
        created_by_name: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        stats:
          oneOf:
            - type: "null"
            - type: object
              properties:
                recipients: { type: integer }
                read: { type: integer }
                sent: { type: integer }
                pending: { type: integer }
                failed: { type: integer }
    StopProgress:
      type: object
      properties:
        stop_id: { type: string, description: 'Stop ID, or "school" for the school (end of Morning Pickup).' }
        sequence: { type: integer }
        name: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        radius_m: { type: number }
        scheduled_time: { type: [string, "null"], description: "Pickup time (morning) or drop time (evening), HH:MM." }
        status: { type: string, enum: [upcoming, approaching, reached, crossed] }
        missed: { type: boolean, description: Crossed without being reached. }
        reached_at: { type: [string, "null"], format: date-time }
        crossed_at: { type: [string, "null"], format: date-time }
        eta_seconds: { type: [integer, "null"], description: From the bus's current position; null once reached or crossed. }
        distance_m: { type: [integer, "null"] }
    TripProgress:
      type: object
      properties:
        trip_id: { type: string, format: uuid }
        trip_type: { type: string, enum: [morning_pickup, evening_drop] }
        stops: { type: array, items: { $ref: "#/components/schemas/StopProgress" }, description: In travel order. }
        speed_mps: { type: number, description: Smoothed recent speed. }
        eta_source: { type: string, enum: [google, estimate] }
        updated_at: { type: string, format: date-time }
    TripProgressResponse:
      type: object
      properties:
        progress:
          oneOf: [{ $ref: "#/components/schemas/TripProgress" }, { type: "null" }]
          description: Null when the trip is not in progress or has no GPS yet.
        location:
          oneOf: [{ $ref: "#/components/schemas/BusLocation" }, { type: "null" }]
        events:
          type: array
          items:
            type: object
            properties:
              stop_id: { type: [string, "null"], description: Null for school_reached. }
              stop_name: { type: [string, "null"] }
              event_type: { type: string, enum: [approaching, reached, crossed, school_reached] }
              missed: { type: boolean }
              occurred_at: { type: string, format: date-time }
    ParentLive:
      type: object
      properties:
        trip:
          oneOf: [{ $ref: "#/components/schemas/ParentTrip" }, { type: "null" }]
        bus:
          oneOf:
            - type: "null"
            - type: object
              properties:
                bus_number: { type: string }
                latitude: { type: number }
                longitude: { type: number }
                speed_mps: { type: [number, "null"] }
                heading: { type: [number, "null"] }
                state: { type: string, enum: [moving, stopped, offline] }
                last_seen: { type: string, format: date-time }
        child_stop:
          oneOf:
            - type: "null"
            - type: object
              properties:
                stop_id: { type: string, format: uuid }
                name: { type: string }
                status: { type: string, enum: [upcoming, approaching, reached, crossed] }
                missed: { type: boolean }
                scheduled_time: { type: [string, "null"] }
                eta_seconds: { type: [integer, "null"] }
                distance_m: { type: [integer, "null"] }
                reached_at: { type: [string, "null"], format: date-time }
                crossed_at: { type: [string, "null"], format: date-time }
        eta_source: { type: string, enum: [google, estimate, ""] }
    GpsPoint:
      type: object
      required: [latitude, longitude, accuracy_m, recorded_at]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracy_m: { type: number, exclusiveMinimum: 0, description: Horizontal accuracy in metres; worse than 100 is rejected. }
        speed_mps: { type: [number, "null"], description: "Metres per second, if the device reports it." }
        heading: { type: [number, "null"], description: "Degrees from north, if available." }
        recorded_at: { type: string, format: date-time, description: Device time of the fix (UTC). }
    BusLocation:
      type: object
      description: The current position of the bus on a trip in progress.
      properties:
        trip_id: { type: string, format: uuid }
        school_id: { type: string, format: uuid }
        trip_type: { type: string, enum: [morning_pickup, evening_drop] }
        route_id: { type: string, format: uuid }
        route_code: { type: string }
        bus_number: { type: string }
        driver_name: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        accuracy_m: { type: number }
        speed_mps: { type: [number, "null"] }
        heading: { type: [number, "null"] }
        recorded_at: { type: string, format: date-time, description: Device time of the fix. }
        received_at: { type: string, format: date-time, description: When the server received it ("last seen"). }
        stale: { type: boolean, description: No GPS for longer than the school's stale_after_seconds. }
      example:
        trip_id: 8a000000-0000-4000-8000-000000000060
        school_id: 4f1d2a3b-0000-4000-8000-000000000002
        trip_type: morning_pickup
        route_id: 5e000000-0000-4000-8000-000000000040
        route_code: RS-01
        bus_number: TN-38-AB-1234
        driver_name: Kumar
        latitude: 11.0172
        longitude: 76.9671
        accuracy_m: 6
        speed_mps: 8.1
        heading: 80
        recorded_at: "2026-10-07T01:40:10Z"
        received_at: "2026-10-07T01:40:11Z"
        stale: false
    TrackingSettings:
      type: object
      required: [location_retention_days, stale_after_seconds, approach_distance_m]
      properties:
        location_retention_days: { type: integer, minimum: 0, maximum: 365, description: "Days of GPS history to keep; 0 keeps none." }
        stale_after_seconds: { type: integer, minimum: 30, maximum: 1800, description: No GPS for this long marks a bus offline. }
        approach_distance_m: { type: integer, minimum: 100, maximum: 5000, description: '"Approaching" fires within this distance.' }
        school_latitude: { type: [number, "null"], description: "The school's location: Morning Pickup destination (School Reached)." }
        school_longitude: { type: [number, "null"] }
        default_geofence_m: { type: integer, minimum: 25, maximum: 1000, default: 100, description: Arrival radius for new stops. }
    TripInput:
      type: object
      required: [trip_date, trip_type, route_id, bus_id, driver_id]
      properties:
        trip_date: { type: string, format: date, example: "2026-10-07" }
        trip_type: { type: string, enum: [morning_pickup, evening_drop] }
        route_id: { type: string, format: uuid }
        bus_id: { type: string, format: uuid }
        driver_id: { type: string, format: uuid }
        notes: { type: string, maxLength: 500 }
    Trip:
      type: object
      required: [id, school_id, trip_date, trip_type, status, route, bus, driver, student_count]
      properties:
        id: { type: string, format: uuid }
        school_id: { type: string, format: uuid }
        trip_date: { type: string, format: date, description: In the school's time zone. }
        trip_type: { type: string, enum: [morning_pickup, evening_drop] }
        status: { type: string, enum: [scheduled, confirmed, started, completed, cancelled] }
        route:
          type: object
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            name: { type: string }
            stop_count: { type: integer }
        bus:
          type: object
          properties:
            id: { type: string, format: uuid }
            vehicle_number: { type: string }
            capacity: { type: integer }
        driver:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            mobile: { type: string }
        student_count: { type: integer, description: Students on the route with a stop for this trip type. }
        notes: { type: string }
        cancel_reason: { type: string }
        confirmed_at: { type: [string, "null"], format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        cancelled_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TripStop:
      allOf:
        - $ref: "#/components/schemas/Stop"
        - type: object
          properties:
            student_count: { type: integer, description: Students boarding (Morning Pickup) or getting off (Evening Drop) here. }
    DriverTrip:
      allOf:
        - $ref: "#/components/schemas/Trip"
        - type: object
          required: [stops]
          properties:
            stops: { type: array, items: { $ref: "#/components/schemas/TripStop" } }
    TripStatusChange:
      type: object
      properties:
        from_status: { type: [string, "null"] }
        to_status: { type: string }
        changed_by_name: { type: [string, "null"] }
        changed_by_role: { type: string }
        reason: { type: string }
        created_at: { type: string, format: date-time }
    ParentTrip:
      type: object
      properties:
        id: { type: string, format: uuid }
        trip_date: { type: string, format: date }
        trip_type: { type: string, enum: [morning_pickup, evening_drop] }
        status: { type: string, enum: [scheduled, confirmed, started, completed, cancelled] }
        bus_number: { type: string }
        driver_name: { type: string }
        started_at: { type: [string, "null"], format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        cancel_reason: { type: string }
        child_stop_name: { type: string, description: The child's pickup stop (morning) or drop stop (evening). }
    MapsSettings:
      type: object
      properties:
        browser_key: { type: string }
        server_key_set: { type: boolean }
        server_key_hint: { type: string, example: "…Wxyz" }
    StopRef:
      type: object
      required: [id, name, sequence, latitude, longitude, pickup_time, drop_time]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        sequence: { type: integer }
        latitude: { type: number }
        longitude: { type: number }
        pickup_time: { type: [string, "null"], description: "HH:MM, Morning Pickup" }
        drop_time: { type: [string, "null"], description: "HH:MM, Evening Drop" }
    StudentAssignment:
      type: object
      required: [id, route_id, route_code, route_name, pickup_stop, drop_stop, assigned_at, ended_at]
      properties:
        id: { type: string, format: uuid }
        route_id: { type: string, format: uuid }
        route_code: { type: string }
        route_name: { type: string }
        pickup_stop:
          oneOf: [{ $ref: "#/components/schemas/StopRef" }, { type: "null" }]
          description: Null if the route does not run Morning Pickup.
        drop_stop:
          oneOf: [{ $ref: "#/components/schemas/StopRef" }, { type: "null" }]
          description: Null if the route does not run Evening Drop.
        assigned_by_name: { type: [string, "null"] }
        assigned_at: { type: string, format: date-time }
        ended_at: { type: [string, "null"], format: date-time, description: Null for the current assignment. }
    ParentChild:
      type: object
      required: [student_id, name, admission_no, class, section, assignment]
      properties:
        student_id: { type: string, format: uuid }
        name: { type: string }
        admission_no: { type: string }
        class: { type: string }
        section: { type: string }
        assignment:
          oneOf: [{ $ref: "#/components/schemas/StudentAssignment" }, { type: "null" }]
    StudentInput:
      type: object
      required: [admission_no, name]
      properties:
        admission_no: { type: string, description: Unique per school; stored upper-case. }
        name: { type: string }
        class: { type: string, example: "5" }
        section: { type: string, example: A }
        notes: { type: string, description: Admin-only. }
        transport_status: { type: string, enum: [uses_transport, not_using], default: uses_transport }
    Student:
      type: object
      required: [id, school_id, admission_no, name, class, section, status, transport_status, assignment, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        school_id: { type: string, format: uuid }
        admission_no: { type: string }
        name: { type: string }
        class: { type: string }
        section: { type: string }
        notes: { type: string, description: Omitted for Transport Managers. }
        status: { type: string, enum: [active, inactive] }
        transport_status: { type: string, enum: [uses_transport, not_using] }
        assignment:
          oneOf: [{ $ref: "#/components/schemas/StudentAssignment" }, { type: "null" }]
        parents:
          type: array
          description: Only on GET of a single student.
          items:
            type: object
            properties:
              parent_id: { type: string, format: uuid }
              name: { type: string }
              mobile: { type: string }
              relationship: { type: string, enum: [father, mother, guardian] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ParentInput:
      type: object
      required: [name, mobile]
      properties:
        name: { type: string }
        mobile: { type: string, description: The parent's OTP login number. }
        alternate_mobile: { type: string }
        email: { type: string }
        address: { type: string }
        children:
          type: array
          description: Replaces the linked children on update.
          items:
            type: object
            required: [student_id]
            properties:
              student_id: { type: string, format: uuid }
              relationship: { type: string, enum: [father, mother, guardian], default: guardian }
    Parent:
      type: object
      required: [id, school_id, user_id, name, mobile, status, children, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        school_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string }
        mobile: { type: string }
        alternate_mobile: { type: string }
        email: { type: string }
        address: { type: string }
        status: { type: string, enum: [active, inactive] }
        last_login_at: { type: [string, "null"], format: date-time }
        children:
          type: array
          items:
            type: object
            properties:
              student_id: { type: string, format: uuid }
              name: { type: string }
              admission_no: { type: string }
              class: { type: string }
              section: { type: string }
              relationship: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ImportResult:
      type: object
      properties:
        dry_run: { type: boolean }
        imported: { type: boolean, description: True only when the data was saved. }
        total_rows: { type: integer }
        students_created: { type: integer }
        students_updated: { type: integer }
        parents_created: { type: integer }
        parent_links: { type: integer }
        assignments_set: { type: integer }
        errors:
          type: array
          items:
            type: object
            properties:
              row: { type: integer, description: Line number in the file (header is line 1). }
              field: { type: string }
              message: { type: string }
    DriverInput:
      type: object
      required: [name, mobile]
      properties:
        name: { type: string, maxLength: 200 }
        mobile: { type: string, description: The driver's OTP login number. }
        license_number: { type: string, maxLength: 30 }
        license_expiry: { type: [string, "null"], format: date }
        address: { type: string }
        emergency_contact_name: { type: string }
        emergency_contact_phone: { type: string }
        id_proof_type: { type: string, example: Aadhaar }
        id_proof_number: { type: string }
        notes: { type: string }
    Driver:
      allOf:
        - $ref: "#/components/schemas/DriverInput"
        - type: object
          required: [id, school_id, user_id, status, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            school_id: { type: string, format: uuid }
            user_id: { type: string, format: uuid, description: The driver's login user. }
            status: { type: string, enum: [active, inactive, suspended] }
            last_login_at: { type: [string, "null"], format: date-time }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    BusInput:
      type: object
      required: [vehicle_number, capacity]
      properties:
        vehicle_number: { type: string, example: TN-38-AB-1234, description: Stored upper-case. }
        capacity: { type: integer, minimum: 1, maximum: 100 }
        make_model: { type: string }
        gps_device_id: { type: string, description: Optional hardware tracker ID. }
        notes: { type: string }
    Bus:
      allOf:
        - $ref: "#/components/schemas/BusInput"
        - type: object
          required: [id, school_id, status, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            school_id: { type: string, format: uuid }
            status: { type: string, enum: [active, inactive, maintenance] }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    RouteInput:
      type: object
      required: [name, code]
      properties:
        name: { type: string }
        code: { type: string, example: RS-01, description: Unique per school; stored upper-case. }
        start_point: { type: string, example: School }
        description: { type: string }
        supports_pickup: { type: boolean, default: true, description: Used for Morning Pickup trips. }
        supports_drop: { type: boolean, default: true, description: Used for Evening Drop trips. }
    Route:
      allOf:
        - $ref: "#/components/schemas/RouteInput"
        - type: object
          required: [id, school_id, status, stop_count, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            school_id: { type: string, format: uuid }
            status: { type: string, enum: [active, inactive] }
            stop_count: { type: integer }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            stops:
              type: array
              items: { $ref: "#/components/schemas/Stop" }
              description: Only on GET of a single route, ordered by sequence.
    StopInput:
      type: object
      required: [name, latitude, longitude]
      properties:
        name: { type: string, example: Gandhipuram }
        landmark: { type: string }
        latitude: { type: number, minimum: -90, maximum: 90, example: 11.0168 }
        longitude: { type: number, minimum: -180, maximum: 180, example: 76.9663 }
        pickup_time:
          type: [string, "null"]
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          example: "07:10"
          description: Scheduled Morning Pickup time (HH:MM).
        drop_time:
          type: [string, "null"]
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          example: "16:40"
          description: Scheduled Evening Drop time (HH:MM).
        geofence_radius_m: { type: integer, minimum: 25, maximum: 1000, default: 100, description: Radius for Reached detection. }
    Stop:
      allOf:
        - $ref: "#/components/schemas/StopInput"
        - type: object
          required: [id, route_id, sequence, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            route_id: { type: string, format: uuid }
            sequence: { type: integer, minimum: 1, description: "Travel order, 1..N without gaps." }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    Role:
      type: string
      enum: [super_admin, school_admin, transport_manager, driver, parent]
    User:
      type: object
      required: [id, school_id, role, name, email, mobile, status, totp_enabled, last_login_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        school_id: { type: [string, "null"], format: uuid, description: Null only for Super Admin. }
        role: { $ref: "#/components/schemas/Role" }
        name: { type: string }
        email: { type: [string, "null"] }
        mobile: { type: [string, "null"], example: "+919000000001" }
        status: { type: string, enum: [active, suspended] }
        totp_enabled: { type: boolean }
        last_login_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserInput:
      type: object
      required: [name, email]
      properties:
        name: { type: string, maxLength: 200 }
        email: { type: string, format: email }
        mobile: { type: [string, "null"] }
    Tokens:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: Access token lifetime in seconds. }
        user: { $ref: "#/components/schemas/User" }
      example:
        access_token: eyJhbGciOiJIUzI1NiIs...
        refresh_token: 3q2-7wEXAMPLE...
        token_type: Bearer
        expires_in: 900
        user:
          id: 9b6c1c2e-0000-4000-8000-000000000001
          school_id: 4f1d2a3b-0000-4000-8000-000000000002
          role: driver
          name: Kumar
          email: null
          mobile: "+919000000001"
          status: active
          totp_enabled: false
          last_login_at: "2026-10-07T01:30:00Z"
          created_at: "2026-10-01T09:00:00Z"
          updated_at: "2026-10-01T09:00:00Z"
    LoginResult:
      description: Either `mfa_required` is true with an `mfa_token`, or the token fields are present.
      allOf:
        - type: object
          required: [mfa_required]
          properties:
            mfa_required: { type: boolean }
            mfa_token: { type: string }
        - type: object
          properties:
            access_token: { type: string }
            refresh_token: { type: string }
            token_type: { type: string }
            expires_in: { type: integer }
            user: { $ref: "#/components/schemas/User" }
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        device_name: { type: string }
        user_agent: { type: string }
        ip: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        current: { type: boolean, description: True for the session making this request. }
    School:
      allOf:
        - $ref: "#/components/schemas/SchoolInput"
        - type: object
          required: [id, status, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [active, inactive] }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    SchoolInput:
      type: object
      required: [name, code]
      properties:
        name: { type: string, maxLength: 200 }
        code: { type: string, pattern: "^[A-Za-z0-9-]{2,20}$", description: Unique; stored upper-case. }
        address: { type: string }
        city: { type: string }
        state: { type: string }
        pincode: { type: string, pattern: "^\\d{6}$" }
        contact_name: { type: string }
        contact_phone: { type: string }
        contact_email: { type: string }
        working_days:
          type: array
          items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
          default: [mon, tue, wed, thu, fri]
        timezone: { type: string, default: Asia/Kolkata }
        transport_config: { type: object, description: Free-form settings; structure defined in later sprints. }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }
    PageMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    Health:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, degraded] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [up, down] }
    HealthEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Health" }

  responses:
    TripStateConflict:
      description: |
        The trip is not in a state that allows this. Codes: `invalid_transition`, `not_trip_day`,
        `another_trip_in_progress`, `status_changed` (changed meanwhile: reload).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: invalid_transition, message: This trip is completed and cannot be started. } }
    ValidationFailed:
      description: Invalid input.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: validation_failed, message: One or more fields are invalid., fields: { mobile: must be a valid 10-digit mobile number } } }
    Unauthorized:
      description: Not logged in, bad credentials, or session ended.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: otp_invalid, message: The code is incorrect or has expired. } }
    Forbidden:
      description: Role not allowed, account suspended, or school inactive.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: account_suspended, message: Your account is suspended. Contact your school. } }
    NotFound:
      description: Missing, or belongs to another school.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Duplicate value.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: conflict, message: A record with this email already exists., fields: { email: already exists } } }
    TooManyRequests:
      description: "Rate limited (`rate_limited`, or for OTP `otp_too_soon` / `otp_rate_limited`)."
      headers:
        Retry-After:
          description: Seconds to wait before retrying (sent with `rate_limited`).
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: otp_too_soon, message: Please wait 30 seconds before requesting another code. } }
